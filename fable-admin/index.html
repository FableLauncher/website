<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fable Admin</title>
    <meta
      name="description"
      content="Fable Admin dashboard for managing Fable Launcher updates, ads, announcements, and platform analytics."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Sidebar navigation">
        <div class="brand" aria-label="Fable Admin home">
          <img src="src/assets/fable-logo.png" alt="Fable logo" />
          <div class="brand-copy">
            <span>FABLE</span>
            <small>ADMIN</small>
          </div>
        </div>

        <nav class="nav" aria-label="Main navigation">
          <button class="nav-item active" data-page="dashboard" type="button">
            <span class="nav-icon">▣</span>
            <span>Dashboard</span>
          </button>
          <button class="nav-item" data-page="ads" type="button">
            <span class="nav-icon">▤</span>
            <span>Advertisements</span>
          </button>
          <button class="nav-item" data-page="updates" type="button">
            <span class="nav-icon">↻</span>
            <span>Updates</span>
          </button>
          <button class="nav-item" data-page="announcements" type="button">
            <span class="nav-icon">▱</span>
            <span>Announcements</span>
          </button>
          <button class="nav-item" data-page="analytics" type="button">
            <span class="nav-icon">⌁</span>
            <span>Analytics</span>
          </button>
        </nav>

        <div class="sidebar-divider" aria-hidden="true"></div>

        <button class="nav-item nav-settings" data-page="settings" type="button">
          <span class="nav-icon">⚙</span>
          <span>Settings</span>
        </button>

        <div class="user-panel">
          <div class="user-avatar" aria-label="Admin profile avatar">A</div>
          <div class="user-meta">
            <span>Admin</span>
            <small>Administrator</small>
          </div>
          <button class="user-chevron" type="button" aria-label="Open admin profile menu">▼</button>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="header-left">
            <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Toggle sidebar">☰</button>
            <div class="page-heading">
              <p class="eyebrow">Control center</p>
              <h1 id="page-title">Dashboard</h1>
              <p id="page-description">Overview of your Fable Launcher ecosystem</p>
            </div>
          </div>

          <div class="topbar-actions">
            <label class="search-wrapper" aria-label="Search">
              <span class="search-icon" aria-hidden="true">⌕</span>
              <input id="global-search" type="search" placeholder="Search..." />
            </label>

            <div class="notifications-wrap">
              <button id="notifications-button" class="icon-button" type="button" aria-label="Notifications">
                <span aria-hidden="true">🔔</span>
                <span class="badge">3</span>
              </button>
              <div id="notifications-dropdown" class="dropdown-panel" hidden>
                <div class="dropdown-header">Notifications</div>
                <ul class="notification-list">
                  <li><strong>New download</strong><span>Windows • v0.1.1</span></li>
                  <li><strong>Advertisement clicked</strong><span>Wabbanode • 12 mins ago</span></li>
                  <li><strong>Update published</strong><span>v0.1.1 BETA • 2 hours ago</span></li>
                </ul>
              </div>
            </div>

            <div class="admin-menu-wrap">
              <button id="admin-button" class="admin-button" type="button" aria-label="Admin menu">
                <span class="admin-avatar">A</span>
                <span class="admin-name">Administrator</span>
                <span aria-hidden="true">▾</span>
              </button>
              <div id="admin-dropdown" class="dropdown-panel" hidden>
                <button type="button">Profile</button>
                <button type="button">Preferences</button>
                <button type="button">Sign out</button>
              </div>
            </div>
          </div>
        </header>

        <div id="page-content" class="page-content" aria-live="polite"></div>
      </main>
    </div>

    <div id="modal-overlay" class="modal-overlay" hidden>
      <div id="modal-container" class="modal-container" role="dialog" aria-modal="true"></div>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="script.js"></script>
  </body>
</html>
